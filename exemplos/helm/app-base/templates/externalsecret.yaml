{{/*
Referência a segredo: um ExternalSecret por destino.

O time escreve, no values.yaml, o caminho e o nome da variável. Este template
monta o caminho completo no Conjur com o time, a aplicação e o AMBIENTE, que vem
do overlay. O mesmo values.yaml serve aos três ambientes, e o ambiente decide
qual segredo é lido: quem trabalha em dev nunca vê a senha de produção.

O SecretStore "conjur" é criado pelo processo de catálogo em cada namespace, e
autentica no Conjur com o token da ServiceAccount conjur-leitor daquele
namespace (exemplos/segredos/). A aplicação não tem identidade no Conjur.
*/}}
{{- $app := include "app-base.fullname" . -}}
{{- $raiz := printf "%s/%s/%s" (required "time é obrigatório" .Values.time) $app .Values.ambiente -}}
{{- $destinos := dict -}}
{{- range .Values.segredos -}}
{{- $d := default "segredo" .destino -}}
{{- $atual := get $destinos $d -}}
{{- if not $atual }}{{ $atual = list }}{{ end -}}
{{- $_ := set $destinos $d (append $atual .) -}}
{{- end -}}
{{- range $destino, $itens := $destinos }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-{{ $destino }}
  labels: {{- include "app-base.labels" $ | nindent 4 }}
  annotations:
    # Onda -2: o segredo existe e está saudável antes da migração (onda -1) e
    # antes dos pods (onda 0). O Argo CD só aprova o ExternalSecret quando o
    # External Secrets confirma que buscou o valor no Conjur.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $.Values.segredosIntervalo }}
  secretStoreRef:
    kind: SecretStore
    name: conjur
  target:
    name: {{ $app }}-{{ $destino }}
    creationPolicy: Owner
  data:
    {{- range $itens }}
    {{- $caminho := .caminho }}
    {{- range $variavel, $chave := .chaves }}
    - secretKey: {{ $variavel }}
      remoteRef:
        key: {{ $raiz }}/{{ $caminho }}/{{ $chave }}
    {{- end }}
    {{- end }}
{{- end }}
