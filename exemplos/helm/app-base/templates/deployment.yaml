{{/*
Chart base da plataforma. O time preenche valores; tudo abaixo vem de graça.

Cada bloco aqui corresponde a uma causa conhecida de incidente. Comentário no
template, em vez de documentação separada, porque é onde a pessoa está olhando
quando precisa entender por que a regra existe.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-base.fullname" . }}
  labels: {{- include "app-base.labels" . | nindent 4 }}
  annotations:
    # Quando o PAM rotaciona a senha e o External Secrets atualiza o Secret, o
    # Reloader recria os pods um a um. A conta dupla (ADR-008) garante que o pod
    # ainda não recriado continue conectando com a conta anterior. Em produção,
    # o Rollout lê o modelo deste Deployment, e a recriação passa pelo canário.
    secret.reloader.stakater.com/reload: {{ include "app-base.fullname" . }}-segredo
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # nunca reduz capacidade durante a atualização
      maxSurge: 1
  selector:
    matchLabels: {{- include "app-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "app-base.labels" . | nindent 8 }}
      # Sem anotação de checksum de configuração: o ConfigMap vem do
      # configMapGenerator do overlay, com sufixo calculado do conteúdo. Mudou
      # a configuração, mudou o nome, e o pod é recriado sozinho.
    spec:
      serviceAccountName: {{ include "app-base.fullname" . }}

      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }

      {{- if gt (int .Values.replicaCount) 1 }}
      # Espalha as réplicas por rack. Perder um rack remove parte da capacidade,
      # não a aplicação. whenUnsatisfiable: ScheduleAnyway evita que o pod fique
      # pendente para sempre quando um rack está em manutenção.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "app-base.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "app-base.selectorLabels" . | nindent 14 }}
      {{- end }}

      # Tempo para a aplicação terminar as requisições em andamento.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}

      containers:
        - name: app
          image: "{{ .Values.image.repository }}@{{ required "digest obrigatório: a plataforma não aceita tag mutável" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          ports:
            - { name: http,     containerPort: {{ .Values.service.port }} }
            - { name: metricas, containerPort: 9464 }

          # Três sondas com papéis distintos.
          #
          # início     — dá tempo à JVM de subir sem que a de vitalidade a mate.
          #              Pode usar o mesmo caminho da vitalidade; o que muda é a
          #              tolerância (30 tentativas de 5 s).
          # prontidão  — tira do balanceamento quando a dependência está ruim.
          #              No Spring Boot, inclui o banco.
          # vitalidade — reinicia só quando o processo travou de verdade. No
          #              Spring Boot, NÃO inclui o banco.
          #
          # Usar a verificação do banco na vitalidade é a causa clássica de
          # reinício em cascata: o banco fica lento, todos os pods são mortos ao
          # mesmo tempo, e a carga se concentra nos que sobram até derrubar todos.
          {{- $sondas := index .Values.sondas .Values.linguagem }}
          startupProbe:
            httpGet: { path: {{ $sondas.inicio }}, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: {{ $sondas.prontidao }}, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: {{ $sondas.vitalidade }}, port: http }
            periodSeconds: 15
            failureThreshold: 3

          lifecycle:
            preStop:
              # Sai do balanceamento ANTES de parar de aceitar conexão. Sem esta
              # pausa, o roteador ainda envia tráfego para um pod em encerramento
              # e o usuário vê erro de conexão durante toda atualização.
              exec: { command: ["sh", "-c", "sleep 8"] }

          # Obrigatórios. Pod sem requests faz o escalonador decidir errado e é
          # a causa mais comum de nó desequilibrado e de desalojamento em cascata.
          {{- if not (and .Values.resources.requests .Values.resources.limits) }}
          {{- fail "requests e limits são obrigatórios: declare resources no values.yaml" }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}

          env:
            # O agente Java do OpenTelemetry, embutido na imagem base, lê estas
            # variáveis. Log e trace saem por OTLP para o agente coletor do
            # próprio nó; a métrica é exposta na porta "metricas" e raspada
            # pelo Prometheus do cluster (PodMonitor em servico-e-rota.yaml).
            - { name: OTEL_SERVICE_NAME,           value: {{ include "app-base.fullname" . }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-agente-collector.observabilidade:4317" }
            - { name: OTEL_METRICS_EXPORTER,       value: prometheus }
            - { name: OTEL_EXPORTER_PROMETHEUS_PORT, value: "9464" }
            - { name: OTEL_TRACES_SAMPLER,         value: parentbased_traceidratio }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.ambiente }},sefaz.tier={{ .Values.tier }}"
            # Só o Job da onda -1 migra o banco; a aplicação sobe sem Liquibase.
            - { name: SPRING_LIQUIBASE_ENABLED,    value: "false" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            # Gerado pelo configMapGenerator do overlay de cada ambiente.
            - configMapRef: { name: {{ include "app-base.fullname" . }}-config }
            {{- if .Values.segredos }}
            # Materializado pelo External Secrets a partir do Conjur
            # (templates/externalsecret.yaml).
            - secretRef:    { name: {{ include "app-base.fullname" . }}-segredo }
            {{- end }}

          volumeMounts:
            # readOnlyRootFilesystem exige volume gravável explícito para temporários.
            - { name: tmp,      mountPath: /tmp }
            - { name: cache,    mountPath: /app/cache }

      volumes:
        - { name: tmp,   emptyDir: { medium: Memory, sizeLimit: 64Mi } }
        - { name: cache, emptyDir: { sizeLimit: 512Mi } }
