# Coletor OpenTelemetry — ponto único de entrada de log e trace.
#
# Por que um coletor no meio, em vez de a aplicação enviar direto ao armazenamento:
# trocar Tempo por Jaeger, ou Loki por Elasticsearch, vira alteração deste
# arquivo. Sem ele, seria alteração em 60 aplicações.
#
# Métrica NÃO passa por aqui. O Prometheus de cada cluster raspa a aplicação e
# avalia as regras de alerta localmente, para que prd-dc2 continue alertando sem
# DC1 (docs/04 e docs/05).
#
# Dois níveis:
#   otel-agente   — DaemonSet, um por nó. A aplicação envia para o agente do
#                   próprio nó (Service com internalTrafficPolicy: Local). O
#                   agente usa o exportador loadbalancing com chave traceID:
#                   todos os trechos de um trace chegam à MESMA réplica abaixo.
#   otel-gateway  — este arquivo. Faz amostragem de cauda, que só funciona se a
#                   réplica enxergar o trace inteiro. Sem o balanceamento por
#                   traceID do agente, três réplicas atrás de um Service comum
#                   veriam pedaços de cada trace e decidiriam errado.

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observabilidade
spec:
  mode: deployment
  replicas: 3
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }

    processors:
      # Protege o coletor de si mesmo. Sem este limite, um pico de telemetria
      # derruba o coletor, e perder telemetria durante um incidente é
      # exatamente o pior momento para perder telemetria.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      # Carimba log e trace com namespace, pod, nó, time dono e versão. É o
      # que permite, no Grafana, ir do trace ao log do mesmo pod e filtrar a
      # investigação por time.
      #
      # O gateway recebe os dados do agente do nó, e não do pod: a associação
      # padrão, pelo IP da conexão, apontaria para o pod do agente. O chart
      # coloca o IP do pod em OTEL_RESOURCE_ATTRIBUTES (k8s.pod.ip), e a
      # associação abaixo usa esse atributo. Alternativa descartada: carimbar no
      # agente DaemonSet, que vê o IP de origem; exigiria dar a cada agente
      # acesso de leitura à API do Kubernetes em todos os nós. Custo aceito: a
      # aplicação precisa declarar o próprio IP, o que o chart faz.
      k8sattributes:
        auth_type: serviceAccount
        pod_association:
          - sources:
              - { from: resource_attribute, name: k8s.pod.ip }
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name]
          labels:
            - { tag_name: sefaz.time, key: sefaz.io/time,     from: pod }
            - { tag_name: sefaz.tier, key: sefaz.io/tier,     from: pod }
            - { tag_name: ambiente,   key: sefaz.io/ambiente, from: pod }
            # Canário ou estável, aplicado pelo Argo Rollouts: separa no
            # trace o pedido atendido pela versão nova.
            - { tag_name: versao,     key: sefaz.io/versao,   from: pod }

      # Rede de segurança contra dado sensível em log e atributo de trace.
      # A primeira linha de defesa continua sendo a aplicação não registrar.
      attributes/mascarar:
        actions:
          - { key: cpf,            action: delete }
          - { key: cnpj,           action: delete }
          - { key: http.request.header.authorization, action: delete }
          - { key: db.statement,   action: hash }
      transform/mascarar-corpo:
        log_statements:
          - context: log
            statements:
              # CPF e CNPJ isolados no corpo da mensagem, em qualquer formato.
              # As bordas de palavra (\b) são o que preserva a chave de acesso
              # da NF-e: 44 dígitos seguidos contêm sequências que casariam com
              # CPF, e a chave é justamente o identificador que a investigação
              # de incidente fiscal procura. Inscrição estadual tem formato
              # próprio por estado e entra como regra do catálogo.
              - replace_pattern(body, "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "[CPF]")
              - replace_pattern(body, "\\b\\d{2}\\.?\\d{3}\\.?\\d{3}/?\\d{4}-?\\d{2}\\b", "[CNPJ]")

      # Amostragem de cauda: decide DEPOIS de ver o trace inteiro.
      # A amostragem de cabeça descartaria justamente o trace que deu errado.
      tail_sampling:
        decision_wait: 10s
        num_traces: 100000
        policies:
          - name: todo-erro
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: todo-lento
            type: latency
            latency: { threshold_ms: 1000 }
          - name: rota-critica
            type: string_attribute
            string_attribute: { key: sefaz.rota.critica, values: ["true"] }
          - name: amostra-do-resto
            type: probabilistic
            probabilistic: { sampling_percentage: 1 }

      batch:
        timeout: 5s
        send_batch_size: 8192

    exporters:
      otlp/tempo:
        endpoint: tempo-distributor.observabilidade:4317
        tls: { insecure: true }
        sending_queue: { enabled: true, queue_size: 10000 }
        retry_on_failure: { enabled: true, max_elapsed_time: 300s }

      otlphttp/loki:
        endpoint: http://loki-gateway.observabilidade/otlp
        sending_queue: { enabled: true }

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, attributes/mascarar, tail_sampling, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/mascarar-corpo, batch]
          exporters: [otlphttp/loki]

      telemetry:
        metrics: { level: detailed }   # o coletor também é monitorado
