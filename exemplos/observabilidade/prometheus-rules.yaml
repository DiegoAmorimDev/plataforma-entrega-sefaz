# Alerta por consumo de orçamento de erro.
#
# A ideia: a aplicação declara 99,9% de disponibilidade mensal, o que dá 43
# minutos de erro permitido por mês. O alerta não dispara quando aparece erro.
# Dispara quando a VELOCIDADE de consumo indica que o orçamento vai acabar.
#
# Duas janelas simultâneas em cada regra:
#   - a longa detecta o problema real;
#   - a curta confirma que ele ainda está acontecendo agora.
# Só a longa demora a detectar queda total. Só a curta dispara com qualquer
# soluço de 30 segundos. Exigir as duas dá detecção rápida sem ruído.
#
# Onde roda: no PRÓPRIO cluster de execução (no OpenShift, o monitoramento de
# cargas do usuário avalia o PrometheusRule do namespace, e o Thanos Ruler dele
# consulta também as métricas da plataforma). A regra não depende de plat-dc1:
# prd-dc2 continua alertando na perda de DC1.
#
# O orçamento de erro cobre DEGRADAÇÃO. Queda total produz taxa 0/0, sem série,
# e as regras de consumo não disparam; por isso o nível 1 tem também o alerta
# direto AplicacaoIndisponivel, que não passa por orçamento.
#
# De onde vem a métrica: o Prometheus raspa o pod da aplicação. O agente Java
# do OpenTelemetry expõe as métricas no formato do Prometheus, e o PodMonitor
# do chart base diz ao Prometheus onde buscar. Como cada namespace contém uma
# aplicação em um ambiente, o filtro por namespace basta para isolar a
# aplicação.
#
# Este arquivo é gerado pelo catálogo a partir do SLO declarado. O rótulo
# "time" vem da ficha do catálogo e é o que o Alertmanager usa para rotear.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-nfe-emissor
  namespace: fiscal-nfe-emissor-prd
  labels:
    sefaz.io/tier: "1"
    sefaz.io/time: fiscal
spec:
  groups:
    # -----------------------------------------------------------------------
    # Regras de registro: pré-calculam a taxa de erro em várias janelas.
    # Sem elas, cada avaliação de alerta recalcularia tudo do zero.
    # -----------------------------------------------------------------------
    - name: nfe-emissor.slo.registro
      interval: 30s
      rules:
        - record: sefaz:erro_ratio:5m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd",http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[5m]))
        - record: sefaz:erro_ratio:30m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd",http_response_status_code=~"5.."}[30m]))
            / sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[30m]))
        - record: sefaz:erro_ratio:1h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd",http_response_status_code=~"5.."}[1h]))
            / sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[1h]))
        - record: sefaz:erro_ratio:2h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd",http_response_status_code=~"5.."}[2h]))
            / sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[2h]))
        - record: sefaz:erro_ratio:6h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd",http_response_status_code=~"5.."}[6h]))
            / sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[6h]))
        - record: sefaz:erro_ratio:1d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd",http_response_status_code=~"5.."}[1d]))
            / sum(rate(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[1d]))

    - name: nfe-emissor.slo.alertas
      rules:
        # ---------------------------------------------------------------
        # CHAMADA TELEFÔNICA — 14,4x. Orçamento do mês acaba em 2 dias.
        # Limiar: 0.001 (1 - 0.999) * 14.4 = 0.0144
        # ---------------------------------------------------------------
        - alert: OrcamentoErroQueimaRapida
          expr: |
            sefaz:erro_ratio:1h  > (14.4 * 0.001)
            and
            sefaz:erro_ratio:5m  > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
            tier: "1"
            time: fiscal
          annotations:
            summary: "nfe-emissor consome orçamento de erro 14x acima do normal"
            description: >-
              Taxa de erro de {{ $value | humanizePercentage }} na última hora.
              No ritmo atual, o orçamento mensal de 43 minutos acaba em 2 dias.
            runbook_url: "https://wiki.sefaz.interno/runbooks/nfe-emissor/erro-5xx"
            painel: "https://grafana.sefaz.interno/d/app/nfe-emissor"

        # ---------------------------------------------------------------
        # CHAMADA TELEFÔNICA — 6x. Degradação mais lenta, ainda grave.
        # ---------------------------------------------------------------
        - alert: OrcamentoErroQueimaMedia
          expr: |
            sefaz:erro_ratio:6h  > (6 * 0.001)
            and
            sefaz:erro_ratio:30m > (6 * 0.001)
          for: 15m
          labels:
            severity: critical
            tier: "1"
            time: fiscal
          annotations:
            summary: "nfe-emissor em degradação sustentada há 6 horas"
            description: "Taxa de erro de {{ $value | humanizePercentage }}."
            runbook_url: "https://wiki.sefaz.interno/runbooks/nfe-emissor/erro-5xx"

        # ---------------------------------------------------------------
        # CHAMADO — 3x. Horário comercial resolve. Também com duas janelas.
        # ---------------------------------------------------------------
        - alert: OrcamentoErroQueimaLenta
          expr: |
            sefaz:erro_ratio:1d > (3 * 0.001)
            and
            sefaz:erro_ratio:2h > (3 * 0.001)
          for: 1h
          labels:
            severity: warning
            time: fiscal
          annotations:
            summary: "nfe-emissor consumindo orçamento acima do previsto"
            runbook_url: "https://wiki.sefaz.interno/runbooks/nfe-emissor/erro-5xx"

        # ---------------------------------------------------------------
        # QUEDA TOTAL — nível 1. Nenhuma réplica pronta, ou 100% de resposta 5xx
        # no roteador. Não usa orçamento: com a aplicação fora, a taxa de erro
        # da aplicação não existe. Detecta em cerca de 2 minutos, e não nos 20 da
        # regra de métrica ausente.
        #
        # Custo aceito: sem o filtro de duas janelas, uma queda de 2 minutos
        # liga o telefone. Para nível 1, esse é o preço certo; para os demais
        # níveis, este alerta não existe. Os rótulos kube_* e haproxy_* vêm do
        # monitoramento da plataforma (confirmar exported_namespace no
        # laboratório).
        # ---------------------------------------------------------------
        - alert: AplicacaoIndisponivel
          expr: |
            (sum(kube_pod_status_ready{namespace="fiscal-nfe-emissor-prd",condition="true"}) == 0)
            or absent(kube_pod_status_ready{namespace="fiscal-nfe-emissor-prd",condition="true"})
            or (
              sum(rate(haproxy_backend_http_responses_total{exported_namespace="fiscal-nfe-emissor-prd",code="5xx"}[2m]))
              / sum(rate(haproxy_backend_http_responses_total{exported_namespace="fiscal-nfe-emissor-prd"}[2m]))
              >= 1
            )
          for: 2m
          labels:
            severity: critical
            tier: "1"
            time: fiscal
          annotations:
            summary: "nfe-emissor fora do ar: nenhuma réplica pronta ou 100% de erro no roteador"
            runbook_url: "https://wiki.sefaz.interno/runbooks/nfe-emissor/fora-do-ar"
            painel: "https://grafana.sefaz.interno/d/app/nfe-emissor"

        # ---------------------------------------------------------------
        # A métrica sumiu. Sem esta regra, uma aplicação que parou de expor
        # métrica tem taxa de erro "nenhuma" e nunca alerta: o silêncio
        # parece saúde.
        # ---------------------------------------------------------------
        - alert: MetricaDaAplicacaoAusente
          expr: |
            absent_over_time(http_server_request_duration_seconds_count{namespace="fiscal-nfe-emissor-prd"}[15m])
          for: 5m
          labels:
            severity: critical
            tier: "1"
            time: fiscal
          annotations:
            summary: "nfe-emissor parou de expor métrica há 20 minutos"
            runbook_url: "https://wiki.sefaz.interno/runbooks/nfe-emissor/metrica-ausente"
---
# Regras da plataforma, num objeto próprio, no Prometheus de plataforma do
# cluster. Elas usam métrica de nó e de todos os namespaces, que o
# monitoramento de cargas do usuário não enxerga a partir do namespace de uma
# aplicação. Uma cópia por cluster, e não uma por aplicação: o sinal de vida
# dentro de cada PrometheusRule de aplicação seria enviado 60 vezes.
#
# Tipo AlertingRule, e não PrometheusRule: no OpenShift, a Red Hat só suporta
# regra própria no namespace openshift-monitoring por esse objeto, e um
# PrometheusRule ali nem seria carregado sem os rótulos do seletor da
# plataforma. Custo: a regra fica no formato do AlertingRule, que a Red Hat
# valida, e não aceita tudo o que o PrometheusRule aceita.
apiVersion: monitoring.openshift.io/v1
kind: AlertingRule
metadata:
  name: plataforma
  namespace: openshift-monitoring
  labels:
    sefaz.io/time: plataforma
spec:
  groups:
    # -----------------------------------------------------------------------
    # Capacidade: alerta por PREVISÃO, não por percentual atual.
    #
    # Disco em 85% não é problema se cresce 1% ao mês. Disco em 60% que enche
    # em 4 horas é. predict_linear responde a pergunta certa.
    # -----------------------------------------------------------------------
    - name: plataforma.capacidade
      rules:
        # No RHCOS não existe ponto de montagem em /var/lib/containers: o
        # armazenamento do runtime fica no disco do sistema, em /var (montado
        # sobre /sysroot). Confirmar os pontos reais num nó, com
        # node_filesystem_size_bytes, no laboratório. No RKE2 de desenvolvimento
        # o disco do runtime é /var/lib/rancher.
        - alert: DiscoEncheEmBreve
          expr: |
            predict_linear(node_filesystem_avail_bytes{mountpoint=~"/var|/sysroot"}[6h], 4*3600) < 0
          for: 15m
          labels:
            severity: critical
            time: plataforma
          annotations:
            summary: "{{ $labels.instance }}: o disco do sistema ({{ $labels.mountpoint }}) enche em menos de 4 horas"
            runbook_url: "https://wiki.sefaz.interno/runbooks/plataforma/disco-cheio"

        # Nó fora do ar. É a fonte da inibição em alertmanager.yaml: com o nó
        # caído, os alertas de pod não pronto do cluster calam.
        - alert: NoIndisponivel
          expr: kube_node_status_condition{condition="Ready",status!="true"} == 1
          for: 5m
          labels:
            severity: critical
            time: plataforma
          annotations:
            summary: "Nó {{ $labels.node }} fora de serviço há mais de 5 minutos"
            runbook_url: "https://wiki.sefaz.interno/runbooks/plataforma/no-indisponivel"

        - alert: CertificadoVencendo
          expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
          for: 1h
          labels:
            severity: warning
            time: plataforma
          annotations:
            summary: "Certificado de {{ $labels.instance }} vence em {{ $value | humanize }} dias"
            runbook_url: "https://wiki.sefaz.interno/runbooks/plataforma/renovar-certificado"

        # Memória contra o limite, não contra o nó. É o que antecipa o
        # encerramento por falta de memória, que de outra forma aparece como
        # reinício sem causa visível.
        - alert: PodProximoDoLimiteDeMemoria
          expr: |
            container_memory_working_set_bytes{container!=""}
            / on(namespace,pod,container) kube_pod_container_resource_limits{resource="memory"}
            > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} em 90% do limite de memória"
            description: "O contêiner será encerrado por falta de memória se continuar."

    # -----------------------------------------------------------------------
    # Sinal de vida. Dispara SEMPRE, em cada cluster. O Alertmanager do próprio
    # cluster o envia a cada minuto para um serviço de vigilância fora dos dois
    # datacenters, com o rótulo do cluster. Se o sinal de um cluster parar de
    # chegar, é porque a cadeia de alerta dele caiu, e a vigilância aciona o
    # plantão da plataforma por conta própria (docs/05).
    # -----------------------------------------------------------------------
    - name: plataforma.sinal-de-vida
      rules:
        - alert: SinalDeVida
          expr: vector(1)
          labels:
            severity: none
            time: plataforma
          annotations:
            summary: "A cadeia de alerta deste cluster está funcionando"
