# Criado pelo processo de catálogo em cada namespace de aplicação, junto com
# a cota, a NetworkPolicy e o RoleBinding (docs/02). O time não cria nem altera
# este objeto: o AppProject do time proíbe SecretStore.
#
# Um SecretStore por namespace, e não um ClusterSecretStore para o cluster
# inteiro, de propósito. Com um só, a identidade do External Secrets leria o
# segredo de todas as aplicações, e um ExternalSecret mal escrito num namespace
# alcançaria o segredo de outro. Por namespace, cada um só lê o que a política
# do Conjur concede à ServiceAccount daquele namespace.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-leitor
  namespace: fiscal-nfe-emissor-prd
# Nenhum pod usa esta ServiceAccount. Ela existe só como identidade no Conjur;
# a aplicação roda com a própria ServiceAccount e não fala com o cofre.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur
  namespace: fiscal-nfe-emissor-prd
spec:
  provider:
    conjur:
      # Réplica de leitura do Conjur no próprio sítio. Leitura não atravessa o
      # enlace entre datacenters; a escrita, só do PAM, vai ao líder.
      url: https://conjur-leitura.dc1.sefaz.interno
      caProvider:
        type: ConfigMap
        name: ca-corporativa
        key: ca.crt
      auth:
        jwt:
          account: sefaz
          serviceID: prd            # autenticador conjur/authn-jwt/prd
          serviceAccountRef:
            name: conjur-leitor
            # Token de curta duração, emitido para este público e só para ele.
            audiences: [https://conjur.sefaz.interno]
