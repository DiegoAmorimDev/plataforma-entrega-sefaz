# Análise automática do canário. É isto que devolve o tráfego sozinho quando a
# versão nova piora, sem acordar ninguém.
#
# As duas métricas comparam a versão canário com a estável AO MESMO TEMPO, e não
# com um limiar fixo. Limiar fixo gera falso positivo em horário de pico e falso
# negativo de madrugada.

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canario-saude
spec:
  args:
    - name: app
    - name: namespace

  metrics:
    - name: taxa-erro
      interval: 1m
      count: 15                 # 15 minutos de observação
      failureLimit: 2           # duas medições ruins encerram o canário
      initialDelay: 2m          # ignora o aquecimento da aplicação
      successCondition: result[0] <= 0.01
      provider:
        prometheus:
          address: http://thanos-query.observabilidade:9090
          query: |
            sum(rate(http_server_request_duration_seconds_count{
              namespace="{{args.namespace}}",
              app="{{args.app}}",
              version="canary",
              http_response_status_code=~"5.."
            }[2m]))
            /
            sum(rate(http_server_request_duration_seconds_count{
              namespace="{{args.namespace}}",
              app="{{args.app}}",
              version="canary"
            }[2m]))

    - name: latencia-p95-relativa
      interval: 1m
      count: 15
      failureLimit: 3
      initialDelay: 2m
      # Reprova se o canário ficar 20% mais lento que a versão estável.
      successCondition: result[0] <= 1.2
      provider:
        prometheus:
          address: http://thanos-query.observabilidade:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(
              http_server_request_duration_seconds_bucket{
                namespace="{{args.namespace}}", app="{{args.app}}", version="canary"
              }[5m])))
            /
            histogram_quantile(0.95, sum by (le) (rate(
              http_server_request_duration_seconds_bucket{
                namespace="{{args.namespace}}", app="{{args.app}}", version="stable"
              }[5m])))
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nfe-emissor
spec:
  strategy:
    canary:
      canaryService: nfe-emissor-canary
      stableService: nfe-emissor-stable
      trafficRouting:
        # O roteador do OpenShift divide o tráfego por peso entre os dois Services.
        openshift:
          routes: [nfe-emissor]
      analysis:
        templates:
          - templateName: canario-saude
        args:
          - name: app
            value: nfe-emissor
          - name: namespace
            value: fiscal-nfe-emissor-prd
      steps:
        - setWeight: 10
        - pause: { duration: 15m }    # a análise roda durante esta pausa
        - setWeight: 50
        - pause: { duration: 10m }
        - setWeight: 100
      # Falha na análise devolve 100% do tráfego à versão estável e reabre o
      # merge request de promoção com o relatório anexado.
      abortScaleDownDelaySeconds: 600
