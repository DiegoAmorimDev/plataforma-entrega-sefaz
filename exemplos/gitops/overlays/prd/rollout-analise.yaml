# Canário com análise automática, para aplicações de nível 1. É isto que
# devolve o tráfego sozinho quando a versão nova piora, sem acordar ninguém.
# As demais aplicações fazem atualização gradual do Deployment, com retorno por
# git revert.
#
# As duas métricas comparam a versão canário com a estável AO MESMO TEMPO, e não
# com um limiar fixo. Limiar fixo gera falso positivo em horário de pico e falso
# negativo de madrugada.
#
# A consulta vai ao Prometheus do PRÓPRIO cluster, que raspa os pods pelo
# PodMonitor do chart. Assim o canário de prd-dc2 funciona mesmo sem DC1, e a
# análise de um sítio nunca enxerga o canário do outro. No OpenShift, a consulta
# vai ao thanos-querier (monitoramento de cargas do usuário incluso), com o token
# da ServiceAccount do Argo Rollouts, declarada no fim deste arquivo. O rótulo
# sefaz_io_versao vem do rótulo de pod sefaz.io/versao, que o Argo Rollouts
# aplica (canaryMetadata e stableMetadata).
#
# Custo aceito: o papel cluster-monitoring-view deixa esse token ler todas as
# métricas do cluster, e não só as do namespace. A alternativa, a porta de
# tenancy (9092), restringe ao namespace, mas exige o parâmetro namespace em
# cada consulta, que o provedor do Argo Rollouts não acrescenta. Confirmar no
# laboratório.

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canario-saude
spec:
  args:
    - name: namespace
    - name: token
      valueFrom:
        secretKeyRef: { name: rollouts-consulta-token, key: token }

  metrics:
    # Reprova se a taxa de erro do canário passar de 1,5 vez a da estável.
    # O "+ 0.001" no denominador evita divisão por zero quando a estável não
    # tem erro nenhum: aí o canário reprova a partir de 0,15% de erro.
    - name: taxa-erro-relativa
      interval: 1m
      count: 15                 # 15 minutos de observação
      failureLimit: 2           # duas medições ruins encerram o canário
      initialDelay: 2m          # ignora o aquecimento da JVM
      # Sem dado (resultado vazio), a medição conta como erro, não como sucesso.
      successCondition: len(result) > 0 && result[0] <= 1.5
      provider:
        prometheus:
          address: https://thanos-querier.openshift-monitoring.svc:9091
          insecure: false     # a CA de serviço do OpenShift está no controlador do Rollouts
          headers:
            - { key: Authorization, value: "Bearer {{args.token}}" }
          query: |
            (
              # "or vector(0)": sem nenhum 5xx, a série não existe e a divisão
              # devolveria vazio, o que abortaria um canário saudável.
              (sum(rate(http_server_request_duration_seconds_count{namespace="{{args.namespace}}", sefaz_io_versao="canario", http_response_status_code=~"5.."}[2m])) or vector(0))
              / sum(rate(http_server_request_duration_seconds_count{namespace="{{args.namespace}}", sefaz_io_versao="canario"}[2m]))
            )
            /
            (
              (sum(rate(http_server_request_duration_seconds_count{namespace="{{args.namespace}}", sefaz_io_versao="estavel", http_response_status_code=~"5.."}[2m])) or vector(0))
              / sum(rate(http_server_request_duration_seconds_count{namespace="{{args.namespace}}", sefaz_io_versao="estavel"}[2m]))
              + 0.001
            )

    # Reprova se o canário ficar 20% mais lento que a versão estável.
    - name: latencia-p95-relativa
      interval: 1m
      count: 15
      failureLimit: 3
      initialDelay: 2m
      successCondition: len(result) > 0 && result[0] <= 1.2
      provider:
        prometheus:
          address: https://thanos-querier.openshift-monitoring.svc:9091
          insecure: false
          headers:
            - { key: Authorization, value: "Bearer {{args.token}}" }
          query: |
            histogram_quantile(0.95, sum by (le) (rate(
              http_server_request_duration_seconds_bucket{namespace="{{args.namespace}}", sefaz_io_versao="canario"}[5m])))
            /
            histogram_quantile(0.95, sum by (le) (rate(
              http_server_request_duration_seconds_bucket{namespace="{{args.namespace}}", sefaz_io_versao="estavel"}[5m])))
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nfe-emissor
spec:
  replicas: 6
  # Voltar para uma das três últimas revisões pula os passos do canário: o
  # retorno de versão em produção leva minutos, e não os 25 do canário.
  #
  # Durante um canário, a primeira ação é abortar o Rollout:
  #   kubectl argo rollouts abort nfe-emissor -n fiscal-nfe-emissor-prd
  # O abort devolve o tráfego à versão estável sem esperar o Git, porque a
  # operação de sincronização do Argo CD fica em andamento até o canário
  # terminar. O git revert vem depois, para o Git voltar a dizer a verdade. Medir
  # no laboratório quanto tempo o abort leva.
  rollbackWindow:
    revisions: 3
  # O Rollout reaproveita o Deployment gerado pelo chart, em vez de duplicar o
  # modelo do pod. Depois da primeira promoção bem-sucedida, o Deployment fica
  # com zero réplicas e o Rollout passa a ser dono dos pods.
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nfe-emissor
    scaleDown: onsuccess
  strategy:
    canary:
      canaryService: nfe-emissor-canario
      stableService: nfe-emissor-estavel
      canaryMetadata:
        labels: { sefaz.io/versao: canario }
      stableMetadata:
        labels: { sefaz.io/versao: estavel }
      trafficRouting:
        # O roteador do OpenShift divide o tráfego por peso entre os dois
        # Services. O suporte vem de uma extensão mantida no argoproj-labs,
        # registrada no ConfigMap do Argo Rollouts. Se ela parar de acompanhar as
        # versões, remover este bloco faz o canário dividir por quantidade de
        # réplicas.
        plugins:
          argoproj-labs/openshift:
            routes: [nfe-emissor]
            namespace: fiscal-nfe-emissor-prd
      analysis:
        templates:
          - templateName: canario-saude
        args:
          - name: namespace
            value: fiscal-nfe-emissor-prd
          - name: token
            valueFrom:
              secretKeyRef: { name: rollouts-consulta-token, key: token }
      steps:
        - setWeight: 10
        - pause: { duration: 15m }    # a análise roda durante esta pausa
        - setWeight: 50
        - pause: { duration: 10m }
        - setWeight: 100
      # 10% por 15 minutos com análise, 50% por 10 minutos, depois tudo. Falha
      # na análise devolve 100% do tráfego à versão estável. A notificação do
      # Argo CD avisa o canal do time e o estado do commit no GitLab.
      abortScaleDownDelaySeconds: 600
---
# Os dois Services que o canário usa. O Argo Rollouts acrescenta ao seletor de
# cada um o hash do conjunto de pods correspondente.
apiVersion: v1
kind: Service
metadata:
  name: nfe-emissor-estavel
spec:
  selector: { app.kubernetes.io/name: nfe-emissor }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: nfe-emissor-canario
spec:
  selector: { app.kubernetes.io/name: nfe-emissor }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# Identidade de leitura do canário: ServiceAccount, token e papel de consulta ao
# monitoramento do cluster. O Secret do tipo service-account-token guarda o token
# que as duas métricas enviam ao thanos-querier.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollouts-consulta
---
apiVersion: v1
kind: Secret
metadata:
  name: rollouts-consulta-token
  annotations:
    kubernetes.io/service-account.name: rollouts-consulta
type: kubernetes.io/service-account-token
# O ClusterRoleBinding dessa ServiceAccount ao papel cluster-monitoring-view NÃO
# mora aqui: o AppProject do time não cria recurso de escopo de cluster. Ele vem
# de plataforma-addons/namespaces/, junto com a cota e a NetworkPolicy do
# namespace, aplicado pelo projeto "plataforma" do Argo CD.
