# ApplicationSet que gera uma Application do Argo CD por aplicação e por cluster.
#
# O efeito prático: aplicação nova não exige nenhuma configuração no Argo CD.
# O processo de catálogo cria o diretório em manifestos-apps, e na próxima
# varredura o gerador cria as quatro Applications sozinho.
#
# Sem isso, 60 aplicações em 4 clusters seriam 240 objetos mantidos à mão.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aplicacoes-sefaz
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    # matrix: cruza "todo diretório de aplicação" com "todo cluster de execução".
    - matrix:
        generators:
          - git:
              repoURL: https://git.sefaz.interno/plataforma/manifestos-apps.git
              revision: main
              directories:
                - path: apps/*/*
          # Os clusters entram pelos rótulos do registro, não por endereço fixo
          # neste arquivo. Um terceiro cluster de produção entra registrando o
          # cluster com os rótulos certos, sem tocar aqui.
          #   dev-dc1 → ambiente=dev overlay=dev     prune=true
          #   hml-dc1 → ambiente=hml overlay=hml     prune=true
          #   prd-dc1 → ambiente=prd overlay=prd-dc1 prune=false
          #   prd-dc2 → ambiente=prd overlay=prd-dc2 prune=false
          - clusters:
              selector:
                matchLabels:
                  sefaz.io/execucao: "true"

  template:
    metadata:
      # nfe-emissor-prd-dc1, nfe-emissor-hml-dc1 ...
      name: '{{index .path.segments 2}}-{{.name}}'
      labels:
        sefaz.io/time: '{{index .path.segments 1}}'
        sefaz.io/ambiente: '{{index .metadata.labels "sefaz.io/ambiente"}}'
      annotations:
        # Abre o painel certo direto da tela do Argo CD.
        link.argocd.argoproj.io/external-link: >-
          https://grafana.sefaz.interno/d/app/{{index .path.segments 2}}
        # Avisos para o GitLab, o Grafana e o canal do time (configuracao.yaml).
        notifications.argoproj.io/subscribe.on-sync-succeeded.gitlab: ""
        notifications.argoproj.io/subscribe.on-deployed.grafana: ""
        notifications.argoproj.io/subscribe.on-health-degraded.mattermost: 'canal-{{index .path.segments 1}}'
        notifications.argoproj.io/subscribe.on-sync-failed.mattermost: 'canal-{{index .path.segments 1}}'
    spec:
      project: '{{index .path.segments 1}}'
      source:
        repoURL: https://git.sefaz.interno/plataforma/manifestos-apps.git
        targetRevision: main
        path: '{{.path.path}}/overlays/{{index .metadata.labels "sefaz.io/overlay"}}'
      destination:
        server: '{{.server}}'
        namespace: '{{index .path.segments 1}}-{{index .path.segments 2}}-{{index .metadata.labels "sefaz.io/ambiente"}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=false   # o namespace vem do processo de catálogo, com cota e NetworkPolicy
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
        # Duas tentativas, não cinco: cada tentativa recria o gancho de
        # migração. O changelog aguenta repetir (um DDL por changeset), mas
        # falha que persiste depois de duas tentativas pede gente olhando.
        retry:
          limit: 2
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
        # Ignora as réplicas escritas pelo HPA (kube-controller-manager) e pelo
        # Argo Rollouts, que zera o Deployment depois de assumir os pods. NÃO
        # ignora as réplicas escritas pelo Git: a espera quente de nível 2, que
        # zera as réplicas em prd-dc2, continua valendo. Ignorar o campo
        # inteiro faria o Argo CD desconsiderar também o Git.
        - group: apps
          kind: Deployment
          managedFieldsManagers: [kube-controller-manager, argo-rollouts]
        - group: argoproj.io
          kind: Rollout
          managedFieldsManagers: [kube-controller-manager]
        # O Reloader recria os pods anotando o modelo do pod quando o segredo
        # rotaciona (estratégia "annotations"). Sem esta linha, a correção
        # automática de desvio desfaria a anotação e os pods voltariam com a
        # senha velha.
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - '.spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from"'

  # Campos booleanos não podem ser preenchidos pelo template comum: '{{...}}'
  # vira texto, e o Argo CD espera verdadeiro ou falso. O templatePatch é
  # renderizado antes da conversão e aceita o tipo certo.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          enabled: true
          prune: {{ index .metadata.labels "sefaz.io/prune" }}   # false em produção
          selfHeal: true      # desfaz alteração manual em segundos, dentro da janela
          allowEmpty: false

  # O acesso de emergência desliga a sincronização automática de UMA aplicação
  # (docs/09). Sem esta linha, o controlador do ApplicationSet desfaria a
  # alteração no ciclo seguinte. O custo: mudar a política no templatePatch não
  # alcança Applications já existentes; a mudança exige recriá-las.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy

  # Diretório apagado por engano no Git não pode apagar a aplicação em produção.
  # Duas proteções, porque cada uma cobre metade:
  #   applicationsSync: create-update — o controlador cria e atualiza
  #     Applications, mas nunca as apaga. Exige a opção
  #     applicationsetcontroller.enable.policy.override no Argo CD.
  #   preserveResourcesOnDeletion — se a Application for apagada à mão, os
  #     objetos no cluster ficam.
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
---
# Um AppProject por time, gerado pelo processo de catálogo.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fiscal
  namespace: argocd
spec:
  description: Aplicações do time fiscal
  sourceRepos:
    # Só manifesto. O repositório de código da aplicação não é origem válida.
    - https://git.sefaz.interno/plataforma/manifestos-apps.git
  destinations:
    - server: '*'
      namespace: 'fiscal-*'
  clusterResourceWhitelist: []    # time não cria recurso de escopo global
  namespaceResourceBlacklist:
    # Cota, limite e política de rede vêm do catálogo, não do time.
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
    # A conexão com o Conjur também vem do catálogo. Um time que criasse o
    # próprio SecretStore poderia apontar para outra identidade.
    - group: external-secrets.io
      kind: SecretStore
  roles:
    # Os grupos vêm do Keycloak, que lê o diretório corporativo.
    - name: time
      groups: [SEFAZ-FISCAL-DEV]
      policies:
        - p, proj:fiscal:time, applications, get, fiscal/*, allow
        - p, proj:fiscal:time, applications, sync, fiscal/*-dev-dc1, allow
        - p, proj:fiscal:time, applications, sync, fiscal/*-hml-dc1, allow
        - p, proj:fiscal:time, applications, action/*, fiscal/*-dev-dc1, allow
        - p, proj:fiscal:time, applications, action/*, fiscal/*-hml-dc1, allow
        - p, proj:fiscal:time, logs, get, fiscal/*, allow
    - name: plantao
      groups: [SEFAZ-FISCAL-PLANTAO]
      policies:
        - p, proj:fiscal:plantao, applications, get, fiscal/*, allow
        - p, proj:fiscal:plantao, applications, sync, fiscal/*, allow
        - p, proj:fiscal:plantao, logs, get, fiscal/*, allow
  syncWindows:
    # Janela de mudança de produção. Fora dela, a sincronização fica pendente e
    # aguarda; não falha. Vale também para a correção automática de desvio.
    - kind: allow
      schedule: '0 7 * * 1-5'
      duration: 12h
      # Sem fuso declarado, o horário seria avaliado em UTC: a janela das 7h
      # às 19h viraria 4h às 16h.
      timeZone: America/Sao_Paulo
      applications: ['*-prd-dc*']
      # Sincronização manual fora da janela: quem tem permissão de sincronizar
      # em produção, ou seja, o plantão do time e o plantão da plataforma. Toda
      # ação fica registrada. A correção automática de desvio também espera a
      # janela: fora dela, desvio aparece como alerta (docs/09).
      manualSync: true
