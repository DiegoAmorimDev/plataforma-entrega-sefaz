# HAProxy da borda — um par por datacenter, cada par com o próprio VIP
# mantido por keepalived/VRRP dentro do sítio. Nenhuma VLAN é esticada entre
# os sítios, pela mesma razão do ADR-002. Este arquivo é o do par de DC1; o de
# DC2 é idêntico, com os endereços do próprio sítio, e fica pronto para receber
# o tráfego quando o DNS público for apontado para ele (docs/05, "A borda").
#
# Este arquivo faz duas decisões:
#   1. qual datacenter atende, conforme a saúde do roteador de cada cluster e o
#      nível da aplicação;
#   2. se a aplicação pedida já migrou para a plataforma ou ainda está no legado.
#
# A segunda decisão é o que torna a migração reversível. Tirar uma aplicação do
# mapa de migradas devolve o tráfego ao Apache, e o retorno de uma onda inteira
# é um recarregamento de configuração.

global
    log /dev/log local0 info
    maxconn 40000
    # Perfil moderno de TLS. Cifra fraca em portal de órgão público aparece em
    # relatório de auditoria antes de aparecer em incidente.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor except 127.0.0.0/8
    option  http-server-close
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Fila em vez de erro quando todos os servidores estão no limite de conexões.
    # Só funciona porque cada servidor tem maxconn (default-server abaixo):
    # sem limite por servidor, nada entra na fila.
    timeout queue   30s
    # Repete SOMENTE quando a conexão nem chegou a ser aberta. Repetir depois de
    # tempo esgotado reenviaria um POST que talvez já tenha sido processado: numa
    # Fazenda, isso é autorização de nota ou pagamento em duplicidade.
    retry-on conn-failure
    retries 2
    option redispatch

# ---------------------------------------------------------------------------
# Entrada
# ---------------------------------------------------------------------------

frontend web
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind *:80
    http-request redirect scheme https unless { ssl_fc }

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response del-header Server

    # Identificador de correlação criado na borda. É ele que amarra o log do
    # HAProxy ao trace da aplicação quando alguém pergunta "o que aconteceu com
    # a requisição que fiz às 14h32".
    http-request set-header X-Request-Id %[uuid()] unless { req.hdr(X-Request-Id) -m found }
    http-request capture req.hdr(X-Request-Id) len 36

    # Proteção simples contra abuso, por origem. Não substitui WAF.
    stick-table type ip size 200k expire 60s store http_req_rate(10s)
    http-request track-sc0 src unless { src -f /etc/haproxy/redes-internas.lst }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 300 }

    # ----- A DECISÃO DE MIGRAÇÃO E DE SÍTIO -----
    # Uma linha por aplicação migrada, em arquivo versionado no Git, gerado pelo
    # catálogo e aplicado pelo Ansible. A linha diz para qual backend o host vai:
    #   nfe.sefaz.exemplo.gov.br        plataforma-dois-sitios   # nível 1
    #   portal.sefaz.exemplo.gov.br     plataforma-dc1           # níveis 2 a 4
    # Remover a linha devolve o tráfego ao legado.
    use_backend %[req.hdr(host),lower,map(/etc/haproxy/apps-migradas.map)] if { req.hdr(host),lower,map(/etc/haproxy/apps-migradas.map) -m found }
    default_backend legado

# ---------------------------------------------------------------------------
# Legado — Apache na frente das aplicações ainda em máquina virtual
#
# Vem antes da seção "defaults plataforma" de propósito: tudo o que aparece
# depois dela herda a verificação na porta 1936 e o TLS até o roteador.
# ---------------------------------------------------------------------------

backend legado
    balance roundrobin
    option httpchk GET /status
    http-check expect status 200
    default-server check inter 3s fall 3 rise 2 maxconn 1000

    server apache-dc1-a 10.10.30.21:80
    server apache-dc1-b 10.10.30.22:80
    server apache-dc2-a 10.20.30.21:80 backup
    option allbackups

# ---------------------------------------------------------------------------
# Plataforma — roteadores do OpenShift
#
# A verificação de saúde vai à porta 1936, /healthz/ready, que é a do próprio
# roteador. Verificar a porta 443 sem cabeçalho Host cai na rota padrão, que
# devolve 503, e marcaria todos os roteadores como fora do ar.
# ---------------------------------------------------------------------------

defaults plataforma
    mode    http
    log     global
    option  httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout queue   30s
    retry-on conn-failure
    retries 2
    option  httpchk GET /healthz/ready
    http-check expect status 200
    # Detecção: 3 verificações falhas de 2 segundos, cerca de 6 segundos.
    # TLS até o roteador com o certificado da AC corporativa conferido: o
    # tráfego entre a borda e o cluster também é cifrado e autenticado.
    default-server check port 1936 no-check-ssl inter 2s fall 3 rise 2 maxconn 2000 ssl verify required ca-file /etc/haproxy/ac-corporativa.pem sni req.hdr(host)

# Nível 1: ativo nos dois sítios, 70/30. Perder um sítio inteiro remove o
# conjunto dele em cerca de 6 segundos, e o outro absorve tudo.
backend plataforma-dois-sitios
    balance leastconn
    server rtr-dc1-a 10.10.20.11:443 weight 70
    server rtr-dc1-b 10.10.20.12:443 weight 70
    server rtr-dc1-c 10.10.20.13:443 weight 70
    server rtr-dc2-a 10.20.20.11:443 weight 30
    server rtr-dc2-b 10.20.20.12:443 weight 30
    server rtr-dc2-c 10.20.20.13:443 weight 30

# Níveis 2 a 4: DC1 atende. DC2 só recebe quando DC1 some por inteiro, e para
# o nível 2 isso só serve depois que as réplicas em DC2 forem ativadas.
backend plataforma-dc1
    balance leastconn
    server rtr-dc1-a 10.10.20.11:443
    server rtr-dc1-b 10.10.20.12:443
    server rtr-dc1-c 10.10.20.13:443
    server rtr-dc2-a 10.20.20.11:443 backup
    server rtr-dc2-b 10.20.20.12:443 backup
    server rtr-dc2-c 10.20.20.13:443 backup
    # Usa TODOS os servidores de reserva quando os primários caem, em vez de só
    # o primeiro da lista. Sem isto, a contingência concentra a carga inteira
    # num único roteador de DC2 e ele cai em seguida.
    option allbackups

# ---------------------------------------------------------------------------
# Painel interno
# ---------------------------------------------------------------------------

frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 10s
    # Métricas no formato do Prometheus. É o que permite alertar sobre servidor
    # fora do ar antes de o usuário reclamar.
    http-request use-service prometheus-exporter if { path /metrics }
