---
# Linha de base do sistema operacional, aplicada a toda máquina RHEL da
# plataforma: nós do RKE2, bancos, Conjur, HAProxy e réplicas em DC2.
#
# NÃO se aplica a nó de OpenShift. Aquele nó roda RHCOS, sistema imutável que o
# próprio cluster configura por MachineConfig (docs/06, camada 2).
#
# Regra deste papel: é idempotente, e isso é TESTADO. O pipeline roda o papel
# duas vezes contra uma máquina descartável e falha se a segunda execução
# relatar qualquer "changed". Papel que muda algo a cada execução esconde
# desvio de configuração, porque ninguém mais distingue normal de anormal.

- name: Repositórios internos apontados para o espelho da Secretaria
  ansible.builtin.template:
    src: sefaz-mirror.repo.j2
    dest: /etc/yum.repos.d/sefaz-mirror.repo
    owner: root
    group: root
    mode: "0644"
  notify: limpar cache dnf

- name: Pacotes da linha de base
  ansible.builtin.dnf:
    name:
      - chrony
      - firewalld
      - policycoreutils-python-utils
      - audit
      - sos
      - tuned
      - nfs-utils
      - python3-libselinux
    state: present

- name: SELinux em modo obrigatório
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  # Desligar o SELinux é a saída fácil que vira dívida permanente. Quando um
  # serviço não sobe, a correção é o contexto correto, nunca o modo permissivo.

- name: Horário sincronizado com os servidores internos
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
  notify: reiniciar chronyd
  # Relógio fora de sincronia quebra certificado TLS, token de autenticação e
  # a correlação de log entre máquinas durante investigação de incidente.

- name: Serviços da linha de base ativos
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ ['chronyd', 'auditd'] + ([] if 'rke2' in group_names else ['firewalld']) }}"
  # Nó de RKE2 roda sem firewalld, como o próprio RKE2 recomenda: ele conflita
  # com as regras de rede que o Kubernetes escreve. Ali, a segmentação vem da
  # NetworkPolicy dentro do cluster e do firewall de perímetro da VLAN.

# ---------------------------------------------------------------------------
# Acesso remoto
# ---------------------------------------------------------------------------

- name: Endurecimento do acesso por SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/50-sefaz.conf
    create: true
    mode: "0600"
    regexp: "^{{ item.chave }}"
    line: "{{ item.chave }} {{ item.valor }}"
  loop:
    - { chave: PermitRootLogin,        valor: "no" }
    - { chave: PasswordAuthentication, valor: "no" }
    - { chave: PubkeyAuthentication,   valor: "yes" }
    - { chave: X11Forwarding,          valor: "no" }
    - { chave: ClientAliveInterval,    valor: "300" }
    - { chave: MaxAuthTries,           valor: "3" }
    - { chave: AllowGroups,            valor: "sefaz-infra" }
  notify: validar e recarregar sshd
  # O handler valida com sshd -t ANTES de recarregar. Sem isso, um erro de
  # digitação neste arquivo deixa a máquina inacessível.

- name: Grupo de administração de infraestrutura
  ansible.builtin.group:
    name: sefaz-infra
    state: present

- name: Contas de serviço com chave pública
  ansible.builtin.user:
    name: "{{ item.nome }}"
    groups: sefaz-infra
    append: true
    shell: /bin/bash
    state: present
  loop: "{{ contas_infra }}"
  no_log: true

- name: Chaves autorizadas
  ansible.posix.authorized_key:
    user: "{{ item.nome }}"
    key: "{{ item.chave_publica }}"
    exclusive: true   # remove chave que não está mais no inventário
  loop: "{{ contas_infra }}"
  no_log: true

# ---------------------------------------------------------------------------
# Firewall — negação por padrão, com liberação declarada
# ---------------------------------------------------------------------------

- name: Zona padrão restritiva
  # O módulo firewalld não define a zona padrão; o comando define. O
  # changed_when mantém a tarefa idempotente para o teste de duas execuções.
  ansible.builtin.command: firewall-cmd --set-default-zone=drop
  register: zona_padrao
  changed_when: "'ZONE_ALREADY_SET' not in zona_padrao.stderr"
  when: "'rke2' not in group_names"

- name: Portas liberadas conforme a função da máquina
  when: "'rke2' not in group_names"
  # Porta e origem juntas exigem regra rica: no módulo firewalld, os
  # parâmetros port e source não podem ser usados na mesma tarefa.
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ item.origem }}
      port port={{ item.porta }} protocol={{ item.protocolo }} accept
    zone: drop
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ portas_por_funcao[funcao_do_no] }}"

# ---------------------------------------------------------------------------
# Preparação para nó de Kubernetes — só nós do RKE2
# ---------------------------------------------------------------------------

- name: Preparação de nó do RKE2
  when: "'rke2' in group_names"
  block:
    - name: Swap desligado agora
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Swap fora do fstab
      ansible.posix.mount:
        path: none
        fstype: swap
        state: absent
      # O kubelet não lida bem com swap: ele decide desalojar com base em
      # memória disponível, e swap mascara a pressão real até a máquina ficar
      # inutilizável.

    - name: Módulo br_netfilter carregado agora e na partida
      community.general.modprobe:
        name: br_netfilter
        state: present
        persistent: present
      # Sem ele, o parâmetro bridge-nf-call-iptables abaixo nem existe.

    - name: Parâmetros de kernel para rede de contêiner
      ansible.posix.sysctl:
        name: "{{ item.nome }}"
        value: "{{ item.valor }}"
        sysctl_file: /etc/sysctl.d/90-kubernetes.conf
        reload: true
      loop:
        - { nome: net.ipv4.ip_forward,                 valor: "1" }
        - { nome: net.bridge.bridge-nf-call-iptables,  valor: "1" }
        - { nome: net.ipv4.conf.all.rp_filter,         valor: "1" }
        - { nome: fs.inotify.max_user_instances,       valor: "8192" }
        - { nome: fs.inotify.max_user_watches,         valor: "524288" }
        # Os dois últimos: o padrão do RHEL é baixo demais para um nó com
        # muitos pods, e o sintoma é obscuro — o kubelet para de observar
        # arquivos e os pods ficam presos em ContainerCreating sem erro claro.

    - name: Volume dedicado para o runtime de contêiner
      community.general.filesystem:
        fstype: xfs
        dev: /dev/sdb
      # Imagem e log de contêiner num volume separado. Sem isso, uma aplicação
      # que registra demais enche a raiz e derruba o nó inteiro.

    - name: Montagem do volume onde o RKE2 guarda imagens e contêineres
      ansible.posix.mount:
        path: /var/lib/rancher
        src: /dev/sdb
        fstype: xfs
        opts: defaults,noatime,pquota
        state: mounted

# ---------------------------------------------------------------------------
# Agentes
# ---------------------------------------------------------------------------

- name: Exportador de métricas do nó
  ansible.builtin.include_role:
    name: node-exporter

- name: Agente de backup
  ansible.builtin.include_role:
    name: agente-backup
  when: funcao_do_no in ['banco', 'plataforma-estado']
