# Políticas de admissão. É aqui que a regra escrita no documento vira regra
# aplicada: o cluster recusa o pod que não cumpre, sem depender de alguém
# lembrar durante a revisão.
#
# Toda política entra primeiro em modo Audit por 30 dias, com relatório por
# time. Só depois vira Enforce. Ligar Enforce de uma vez num parque de 60
# aplicações quebra entrega de gente que não foi avisada.
#
# Escopo: só namespaces de aplicação, marcados pelo processo de catálogo com o
# rótulo sefaz.io/aplicacao=true. Namespaces do sistema (openshift-*, kube-*,
# o próprio Kyverno, o Argo CD) ficam fora; aplicar regra de aplicação neles
# recusaria componente da plataforma e pode travar o próprio cluster.
#
# Os mesmos arquivos são aplicados nos quatro clusters de execução. O que muda
# por ambiente é o seletor: origem e assinatura são obrigatórias em homologação
# e produção, e em desenvolvimento ficam em auditoria, porque lá o time pode
# aplicar manifesto direto para experimentar (docs/02).

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: exigir-imagem-assinada
  annotations:
    policies.kyverno.io/description: >-
      A imagem precisa vir do registry interno e ter assinatura válida da
      esteira. Junto com a referência por digest no manifesto, é isto que
      responde à auditoria: o que está em produção é o que passou pelos
      controles.
spec:
  background: true
  webhookTimeoutSeconds: 10
  failurePolicy: Fail      # indisponibilidade do Kyverno impede admissão, não libera

  rules:
    - name: so-registry-interno
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchExpressions:
                  - { key: sefaz.io/aplicacao, operator: In, values: ["true"] }
                  - { key: sefaz.io/ambiente,  operator: In, values: [hml, prd] }
      validate:
        failureAction: Enforce
        message: "Imagem precisa vir de harbor.sefaz.interno."
        foreach:
          - list: "request.object.spec.[initContainers, containers][]"
            pattern:
              image: "harbor.sefaz.interno/*"

    - name: assinatura-da-esteira
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchExpressions:
                  - { key: sefaz.io/aplicacao, operator: In, values: ["true"] }
                  - { key: sefaz.io/ambiente,  operator: In, values: [hml, prd] }
      verifyImages:
        - imageReferences: ["harbor.sefaz.interno/*"]
          failureAction: Enforce
          # Grava o digest resolvido no pod. Mesmo que alguém use tag, o que
          # executa fica registrado por conteúdo.
          mutateDigest: true
          required: true
          attestors:
            - entries:
                - keys:
                    # A chave pública correspondente à privada guardada no
                    # Conjur e usada pelo job de assinatura (ADR-008).
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...chave-publica-da-esteira...
                      -----END PUBLIC KEY-----
                    # Rede fechada: a esteira assina sem publicar no registro
                    # público de transparência (Rekor). Sem estas duas linhas,
                    # o Kyverno exigiria a entrada pública e recusaria todo pod.
                    rekor: { ignoreTlog: true }
                    ctlog: { ignoreSCT: true }

    - name: digest-nao-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchExpressions:
                  - { key: sefaz.io/aplicacao, operator: In, values: ["true"] }
                  - { key: sefaz.io/ambiente,  operator: In, values: [hml, prd] }
      validate:
        failureAction: Enforce
        message: >-
          Em homologação e produção, a imagem precisa ser referenciada por
          digest (@sha256:), não por tag. Tag é ponteiro mutável e pode ser
          reapontada.
        foreach:
          - list: "request.object.spec.[initContainers, containers][]"
            pattern:
              image: "*@sha256:*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: linha-de-base-do-pod
spec:
  background: true
  rules:
    - name: recursos-declarados
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { sefaz.io/aplicacao: "true" }
      validate:
        failureAction: Enforce
        message: >-
          Declare requests e limits de memória. Pod sem requests faz o
          escalonador decidir errado e é a causa mais comum de nó
          desequilibrado.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""

    - name: sondas-obrigatorias
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchExpressions:
                  - { key: sefaz.io/aplicacao, operator: In, values: ["true"] }
                  - { key: sefaz.io/ambiente,  operator: In, values: [hml, prd] }
      # Pod criado por Job (migração, teste de fumaça) termina sozinho e não tem
      # sonda. A exceção é pelo dono do pod, e não por rótulo, que qualquer
      # time poderia colar no próprio Deployment para escapar da regra.
      preconditions:
        all:
          - key: "{{ request.object.metadata.ownerReferences[0].kind || '' }}"
            operator: NotEquals
            value: Job
      validate:
        failureAction: Enforce
        message: "Defina readinessProbe e livenessProbe."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              readinessProbe: { periodSeconds: ">0" }
              livenessProbe:  { periodSeconds: ">0" }

    - name: sem-privilegio
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { sefaz.io/aplicacao: "true" }
      validate:
        failureAction: Enforce
        message: "Contêiner privilegiado ou com escalonamento de privilégio não é admitido."
        foreach:
          - list: "request.object.spec.[initContainers, containers][]"
            pattern:
              securityContext:
                # =( ) é âncora condicional: SE o campo existir, precisa ser
                # false. O padrão do Kubernetes já é não privilegiado, e exigir
                # o campo explícito recusaria pods corretos.
                =(privileged): "false"
                allowPrivilegeEscalation: "false"
---
# Em modo auditoria: coleta evidência antes de obrigar. O relatório por time
# mostra quantos pods violariam a regra, e a data de virada é negociada com o
# número na mão.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auditoria-raiz-somente-leitura
  annotations:
    sefaz.io/vira-enforce-em: "fim da fase 2, depois de 30 dias de relatório"
spec:
  background: true
  rules:
    - name: sistema-de-arquivos-raiz-somente-leitura
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { sefaz.io/aplicacao: "true" }
      validate:
        failureAction: Audit
        message: "Use readOnlyRootFilesystem com volume temporário declarado."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              securityContext:
                readOnlyRootFilesystem: "true"
