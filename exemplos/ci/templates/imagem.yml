# plataforma/templates-ci @ v3 — /base/imagem.yml
#
# A imagem é construída UMA vez, só a partir de main. Nenhum estágio posterior
# reconstrói. O digest produzido aqui é o que atravessa dev, hml e prd.
#
# Kaniko em vez de docker-in-docker: não exige contêiner privilegiado, que a
# política de admissão da plataforma recusa.
#
# O repositório original do Kaniko foi arquivado pelo Google em 2025, e as imagens
# em gcr.io não recebem mais correção de segurança. A plataforma usa a bifurcação
# mantida pela Chainguard, espelhado no Harbor com o utilitário conjur-segredo.
# Se a bifurcação deixar de ser mantida, a troca é pelo Buildah sem privilégio, e só
# este arquivo muda.

construir-imagem:
  extends: [.runner-comum, .identidade-conjur]
  stage: imagem
  image:
    name: ${REGISTRY}/plataforma/kaniko:v1.25-chainguard
    entrypoint: [""]
  # Com needs, o GitLab ignora a ordem dos estágios. Por isso os três jobs de
  # segurança que BLOQUEIAM entram aqui, junto com o portão de qualidade: sem
  # eles verdes, não há imagem.
  needs:
    - compilar
    - sonarqube
    - segredo-no-codigo
    - dependencia-vulneravel
    - analise-estatica
    # Job opcional do time (teste de contrato, por exemplo): se existir, bloqueia.
    - { job: teste-contrato-autorizador, optional: true }
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    # Credencial de escrita no projeto do time no Harbor, lida do Conjur pela
    # identidade do job. Não existe em variável de CI.
    - HARBOR_AUTH="$(conjur-segredo "plataforma/esteira/harbor/${APP_TIME}")"
    - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"${HARBOR_AUTH}\"}}}" > /kaniko/.docker/config.json

    # --reproducible zera o horário das camadas: o mesmo conteúdo gera o mesmo
    # digest, o que torna o build verificável por terceiro.
    # A base aprovada já traz o agente Java do OpenTelemetry: métrica, log e trace
    # saem sem uma linha de instrumentação no código da aplicação.
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        --destination "${IMAGEM}:${CI_COMMIT_SHORT_SHA}"
        --reproducible
        --digest-file /tmp/digest
        --build-arg BASE=${REGISTRY}/base/openjdk-${JAVA_VERSION}-runtime:ubi9
        --label org.opencontainers.image.revision="${CI_COMMIT_SHA}"
        --label org.opencontainers.image.source="${CI_PROJECT_URL}"
        --label sefaz.time="${APP_TIME}"
        --label sefaz.tier="${APP_TIER}"

    - echo "IMAGEM_DIGEST=$(cat /tmp/digest)" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# ---------------------------------------------------------------------------
# BLOQUEIA — vulnerabilidade crítica em camada própria da imagem.
#
# --ignore-unfixed pela mesma razão do arquivo de segurança. Vulnerabilidade na
# imagem BASE não reprova o time: gera chamado para a plataforma, que é quem
# mantém a base.
# ---------------------------------------------------------------------------
varrer-imagem:
  extends: [.runner-comum, .identidade-conjur]
  stage: imagem
  needs: [construir-imagem]
  # Versão fixada e servida pelo proxy do Harbor: a esteira que exige digest
  # das aplicações não puxa ferramenta mutável da internet.
  image: ${REGISTRY}/proxy/aquasec/trivy:0.56.2
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    # O projeto do time no Harbor é privado: o Trivy lê a imagem com a mesma
    # credencial que o construir-imagem usa para escrever nela. O banco de
    # vulnerabilidades vem do espelho no Harbor, porque a rede é fechada.
    - HARBOR_AUTH="$(conjur-segredo "plataforma/esteira/harbor/${APP_TIME}" | base64 -d)"
    - export TRIVY_USERNAME="${HARBOR_AUTH%%:*}" TRIVY_PASSWORD="${HARBOR_AUTH#*:}"
    - export TRIVY_DB_REPOSITORY="${REGISTRY}/proxy/aquasecurity/trivy-db" TRIVY_JAVA_DB_REPOSITORY="${REGISTRY}/proxy/aquasecurity/trivy-java-db"
    - trivy image --skip-db-update --skip-java-db-update --severity CRITICAL --ignore-unfixed --exit-code 1
        --ignorefile .trivyignore-base
        "${IMAGEM}@${IMAGEM_DIGEST}"

gerar-lista-de-componentes:
  extends: [.runner-comum, .identidade-conjur]
  stage: imagem
  needs: [construir-imagem]
  image: ${REGISTRY}/proxy/anchore/syft:v1.14.0
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    # A lista de componentes é o que responde "quais das 60 aplicações usam esta
    # biblioteca" sem abrir chamado para doze times. Ela é anexada à imagem
    # como atestação assinada no job seguinte, que tem a chave.
    - HARBOR_AUTH="$(conjur-segredo "plataforma/esteira/harbor/${APP_TIME}" | base64 -d)"
    - export SYFT_REGISTRY_AUTH_AUTHORITY="${REGISTRY}" SYFT_REGISTRY_AUTH_USERNAME="${HARBOR_AUTH%%:*}" SYFT_REGISTRY_AUTH_PASSWORD="${HARBOR_AUTH#*:}"
    - syft "${IMAGEM}@${IMAGEM_DIGEST}" -o cyclonedx-json > sbom.json
  artifacts:
    paths: [sbom.json]
    expire_in: 5 years

assinar-imagem:
  extends: [.runner-restrito, .identidade-conjur]
  stage: imagem
  needs: [construir-imagem, varrer-imagem, gerar-lista-de-componentes]
  image: ${REGISTRY}/plataforma/cosign:v3
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    # O Conjur não funciona como serviço de chave para o Cosign. A chave privada é
    # lida pela identidade do job, existe só em memória durante a assinatura e é
    # descartada. A política do Conjur só entrega a chave a job de branch
    # protegido, em runner restrito, de projeto autorizado (ADR-008).
    #
    # A assinatura vai para o Harbor, ao lado da imagem: o job precisa da
    # credencial de escrita no projeto do time, também lida do Conjur.
    #
    # Rede fechada: sem registro público de transparência (Rekor). Por padrão,
    # o Cosign publica a assinatura no Rekor público e exige essa entrada na
    # verificação; o runner restrito não alcança a internet, e nem deve. A
    # garantia vem da chave guardada no Conjur, e o Kyverno é configurado para
    # não exigir o registro público.
    - mkdir -p ~/.docker
    - HARBOR_AUTH="$(conjur-segredo "plataforma/esteira/harbor/${APP_TIME}")"
    - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"${HARBOR_AUTH}\"}}}" > ~/.docker/config.json
    - export COSIGN_PASSWORD="$(conjur-segredo plataforma/esteira/cosign-senha)"
    - conjur-segredo plataforma/esteira/cosign-chave > /dev/shm/cosign.key
    #
    # Cosign 3 assina por padrão no formato novo de pacote e com configuração de
    # assinatura, que conflita com --tlog-upload=false e que as versões do Kyverno
    # que só leem o formato antigo (.sig) não verificam. As duas opções abaixo
    # voltam ao comportamento anterior. Confirmar no laboratório; se a combinação
    # falhar, a saída é fixar o cosign v2.4.
    - cosign sign --yes --tlog-upload=false --new-bundle-format=false --use-signing-config=false
        --key /dev/shm/cosign.key "${IMAGEM}@${IMAGEM_DIGEST}"
    # A lista de componentes vira atestação assinada pela mesma chave.
    - cosign attest --yes --tlog-upload=false --new-bundle-format=false --use-signing-config=false
        --key /dev/shm/cosign.key --type cyclonedx
        --predicate sbom.json "${IMAGEM}@${IMAGEM_DIGEST}"
    # A verificação usa a chave pública, a mesma que o Kyverno usa na admissão.
    # Roda antes de apagar a credencial: ler a assinatura no Harbor privado
    # exige o mesmo acesso da escrita.
    - cosign verify --insecure-ignore-tlog=true --key /chaves/cosign-plataforma.pub "${IMAGEM}@${IMAGEM_DIGEST}"
    - rm -f /dev/shm/cosign.key ~/.docker/config.json
