# plataforma/templates-ci @ v3 — /base/qualidade.yml
#
# A decisão deste arquivo está na diferença entre os dois jobs abaixo.
# O quality gate incide sobre CÓDIGO NOVO e bloqueia. A métrica do repositório
# inteiro informa e vira meta trimestral do time.
#
# Razão: uma aplicação legada com 12% de cobertura não chega a 80% numa entrega.
# Portão intransponível produz teste que executa linha sem verificar nada.
#
# O SonarQube é a edição Community, que analisa só main (ADR-012). Por isso o
# quality gate roda depois do merge e ANTES do build da imagem: uma reprovação
# aqui impede que a versão chegue a qualquer ambiente. No merge request, o portão
# de cobertura é o job cobertura-linhas-alteradas, em /linguagens/java.yml.

sonarqube:
  extends: [.job-teste-base, .identidade-conjur]
  stage: qualidade
  needs:
    - compilar
    - teste-unitario
    - { job: teste-integracao-postgres, optional: true }
    - { job: teste-integracao-oracle,   optional: true }
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  variables:
    SONAR_HOST_URL: https://sonar.sefaz.interno
    GIT_DEPTH: "0"   # o Sonar precisa do histórico para saber o que é código novo
  script:
    # Token de análise, sem permissão administrativa, lido do Conjur pela
    # identidade do job. Nunca em variável de CI.
    - export SONAR_TOKEN="$(conjur-segredo plataforma/esteira/sonar-token)"
    - mvn -B sonar:sonar
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
        -Dsonar.qualitygate.wait=true
        -Dsonar.qualitygate.timeout=600
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
        -Dsonar.coverage.exclusions="**/config/**,**/*Application.java"
  allow_failure: false   # BLOQUEIA

# Portão de qualidade aplicado no SonarQube, perfil "SEFAZ - código novo".
# Código novo é definido como "desde a versão anterior".
#   cobertura de linhas novas        >= 80%
#   linhas duplicadas em código novo <=  3%
#   vulnerabilidade em código novo    =  0 (alta ou crítica)
#   bug bloqueante em código novo     =  0
# Problemas de manutenção e complexidade NÃO entram no portão: medem dívida,
# não risco imediato, e aparecem no relatório abaixo (docs/03).

relatorio-divida-tecnica:
  extends: .runner-comum
  stage: qualidade
  needs: [sonarqube]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  image: ${REGISTRY}/plataforma/sonar-report:v3
  script:
    # Mede o repositório inteiro e publica no painel do time. Não reprova nada.
    - sonar-report --project "${SONAR_PROJECT_KEY}" --escopo total --saida divida.md
    - /scripts/publicar-no-painel-do-time.sh divida.md "${APP_TIME}"
  allow_failure: true    # INFORMA
  artifacts:
    paths: [divida.md]
    expire_in: 90 days
