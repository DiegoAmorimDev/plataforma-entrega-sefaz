# O arquivo que um time preenche para existir na plataforma.
#
# Um merge request com este arquivo cria: repositório a partir do template,
# namespaces nos quatro clusters com cota e NetworkPolicy, projeto no Harbor,
# caminho no Vault, diretório de manifestos, Application no Argo CD, painel no
# Grafana, alertas de SLO e grupo de plantão.
#
# Meta: do merge ao primeiro deploy em desenvolvimento, menos de um dia.

apiVersion: catalogo.sefaz.io/v1
kind: Aplicacao

metadata:
  nome: nfe-emissor
  descricao: Emissão e autorização de nota fiscal eletrônica
  time: fiscal

classificacao:
  # Define onde roda, quanta redundância recebe e qual plantão atende.
  # 1 = ativo nos dois sítios, retomada em 15 min, perda máxima de 1 min
  # 2 = ativo em DC1, espera quente em DC2
  # 3 = restauração por backup
  # 4 = sítio único
  tier: 1
  dados_sensiveis: true        # dispara anonimização obrigatória na massa de hml
  retencao_auditoria_anos: 5

tecnologia:
  linguagem: dotnet
  versao_runtime: "8.0"
  imagem_base: dotnet-runtime:8.0-ubi9   # da lista aprovada pela plataforma

rotas:
  - host: nfe.sefaz.gov.br
    publica: true              # entra no mapa de aplicações migradas do HAProxy
    rotas_criticas:            # amostragem de trace em 100%
      - /api/v1/autorizar
      - /api/v1/cancelar

# Vira NetworkPolicy de saída. Sem declarar, o pod só alcança DNS e o coletor.
dependencias:
  bancos:
    - tipo: oracle
      nome: DBFISCAL
      ambiente_dev: postgres-container   # em dev, contêiner descartável
  servicos:
    - sefaz-autorizador
    - sefaz-certificado-digital
  externos:
    - host: autorizador.sefaz.gov.br
      porta: 443
      justificativa: "Autorização de NF-e junto à SEFAZ nacional"
  mensageria:
    - topico: fiscal.nfe.autorizada
      papel: produtor

# Acordado com a área de negócio, não escolhido pelo time sozinho.
# Gera as regras de orçamento de erro e o roteamento de plantão.
slo:
  disponibilidade: 99.9        # 43 minutos de erro por mês
  latencia_p95_ms: 800
  janela: mensal

capacidade:
  dev: { replicas: 1, cpu: 200m,  memoria: 512Mi }
  hml: { replicas: 2, cpu: 500m,  memoria: 1Gi }
  prd: { replicas: 6, cpu: "500m", memoria: 1Gi, limite_cpu: "2", limite_memoria: 2Gi }
  # Medido em teste de carga antes da primeira entrega em produção.
  # Valor chutado aqui vira incidente de capacidade no terceiro mês.

operacao:
  plantao:
    grupo_ad: SEFAZ-FISCAL-PLANTAO
    horario: continuo          # tier 1; tier 2 usa "estendido"
  runbooks: https://wiki.sefaz.interno/runbooks/nfe-emissor
  # Em contingência de sítio único, aplicações marcadas como suspensíveis são
  # desligadas para liberar capacidade. Acordado antes do evento, não durante.
  suspensivel_em_contingencia: false

migracao:
  origem: VM com IIS, Windows Server 2019
  onda: 3
  # Critério de desistência da onda: se não migrar em duas semanas, volta para
  # a fila com o impedimento registrado, e a onda segue sem ela.
  impedimentos_conhecidos:
    - "Certificado A1 em arquivo local; precisa migrar para o Vault"
    - "Sessão em memória; exige ajuste para stateless antes de escalar"
