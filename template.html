<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
  :root {
    --tinta: #15202b;
    --tinta-fraca: #4a5a6a;
    --papel: #ffffff;
    --linha: #d8e0e8;
    --destaque: #1f3b57;
    --codigo-fundo: #f5f7fa;
    --nota-fundo: #eef4fa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Charter", "Georgia", "Times New Roman", serif;
    font-size: 11.5pt;
    line-height: 1.6;
    color: var(--tinta);
    background: var(--papel);
    max-width: 46rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 {
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    line-height: 1.25;
    color: var(--destaque);
    margin-top: 2.2em;
    margin-bottom: 0.6em;
  }
  h1 { font-size: 1.9rem; letter-spacing: -0.015em; border-bottom: 2px solid var(--linha); padding-bottom: 0.35em; page-break-before: always; }
  h1:first-of-type { page-break-before: avoid; }
  h2 { font-size: 1.35rem; letter-spacing: -0.01em; }
  h3 { font-size: 1.1rem; }
  h4 { font-size: 1rem; color: var(--tinta-fraca); }
  p { margin: 0 0 1em; }
  a { color: var(--destaque); text-decoration: none; border-bottom: 1px solid var(--linha); }

  code {
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.85em;
    background: var(--codigo-fundo);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  pre {
    background: var(--codigo-fundo);
    border: 1px solid var(--linha);
    border-radius: 6px;
    padding: 0.9rem 1.1rem;
    overflow-x: auto;
    font-size: 0.8rem;
    line-height: 1.45;
    page-break-inside: avoid;
  }
  pre code { background: none; padding: 0; font-size: inherit; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.4em 0;
    font-size: 0.88rem;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    page-break-inside: avoid;
  }
  th, td { text-align: left; padding: 0.5em 0.7em; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { background: var(--codigo-fundo); font-weight: 600; color: var(--destaque); }

  blockquote {
    margin: 1.4em 0;
    padding: 0.8em 1.1em;
    background: var(--nota-fundo);
    border-left: 3px solid var(--destaque);
    border-radius: 0 5px 5px 0;
    font-size: 0.93rem;
  }
  blockquote p:last-child { margin-bottom: 0; }

  hr { border: none; border-top: 1px solid var(--linha); margin: 2.5em 0; }

  .mermaid {
    background: none;
    border: none;
    text-align: center;
    padding: 1rem 0;
    page-break-inside: avoid;
  }
  .mermaid svg { max-width: 100%; height: auto; }
  img.figura { display: block; width: 100%; height: auto; margin: 0.6rem auto 1.4rem; page-break-inside: avoid; }

  #TOC {
    background: var(--codigo-fundo);
    border: 1px solid var(--linha);
    border-radius: 8px;
    padding: 1.2rem 1.6rem;
    margin: 2rem 0 3rem;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    font-size: 0.9rem;
    page-break-after: always;
  }
  #TOC ul { list-style: none; padding-left: 1rem; margin: 0.3em 0; }
  #TOC > ul { padding-left: 0; }
  #TOC a { border: none; }

  header#title-block-header h1.title {
    font-size: 2.1rem;
    border: none;
    margin-bottom: 0.2em;
  }

  @media print {
    body { max-width: 100%; padding: 0; font-size: 10.5pt; }
    a { color: var(--tinta); border: none; }
    pre, table, blockquote, .mermaid, img.figura { page-break-inside: avoid; }
    h1, h2, h3 { page-break-after: avoid; }
  }
  @page { margin: 1.8cm 1.6cm; }
</style>
</head>
<body>
$if(title)$
<header id="title-block-header">
  <h1 class="title">$title$</h1>
</header>
$endif$
$if(toc)$
<nav id="TOC" role="doc-toc">
$table-of-contents$
</nav>
$endif$
$body$

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "base",
    themeVariables: {
      // mesma régua das figuras do draw.io: Helvetica, tinta #1F2937, linha #4B5563
      fontFamily: "Helvetica, Arial, sans-serif",
      fontSize: "13px",
      primaryColor: "#F3F4F6",
      primaryTextColor: "#1F2937",
      primaryBorderColor: "#6B7280",
      lineColor: "#4B5563",
      secondaryColor: "#F3F4F6",
      tertiaryColor: "#FFFFFF",
      clusterBkg: "#FFFFFF",
      clusterBorder: "#9CA3AF"
    },
    flowchart: { curve: "basis", padding: 16 },
    securityLevel: "loose"
  });
</script>
</body>
</html>
